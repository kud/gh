version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/gh"
      - "/packages/gh-cockpit"
      - "/packages/gh-ink"
      - "/packages/gh-pr-comments"
      - "/packages/gh-pr-health"
      - "/packages/gh-webhook-replay"
      - "/packages/gh-workflow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
